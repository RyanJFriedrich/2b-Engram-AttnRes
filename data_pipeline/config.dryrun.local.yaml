# Dry-run config: 3 seeds, isolated output paths.
# Inherits API details from config.local.yaml — edit there, not here.

interrogate:
  student:
    provider: native_chat
    base_url: "http://localhost:1234"
    api_path: "api/v1/chat"
    api_key: "lm-studio"
    model: "gemma-4-31b-it-abliterated@iq3_s"
    temperature: 0.9

  teacher:
    provider: openai
    base_url: "https://api.poe.com/v1"
    api_key: "sk-poe-mRJCAoo_VBumgf99YI8EML8jPPzUuFSjwDQAZ9JhRaM"
    model: "Llama-3.3-70B-N"
    temperature: 0.7
    max_tokens: 1024
    top_p: null

  seeds: "data_pipeline/seeds.dryrun.jsonl"
  output_dir: "data_pipeline/raw.dryrun"
  max_conversations: 3
  min_turns: 2
  max_turns: 6
  max_total_tokens: 3500
  sleep_seconds: 0.5
  seed: 42

  dedup:
    method: ngram_overlap
    ngram_size: 8
    overlap_threshold: 0.6
  loop_detection:
    enabled: true
    overlap_threshold: 0.7
  length_floor:
    enabled: true
    min_assistant_chars: 300

format:
  input: "data_pipeline/raw.dryrun/conversations.jsonl"
  output: "data_pipeline/formatted.dryrun/formatted.jsonl"
  tokenizer: "OriginalModel"
  verify_identity: true

score:
  input: "data_pipeline/formatted.dryrun/formatted.jsonl"
  shard_dir: "data_pipeline/shards.dryrun/class_b_v1"
  backend: "pytorch"
  donor: "OriginalModel"
  device: "cuda"
  dtype: "bf16"
  k: 10
  max_conversations: 0

metadata:
  text_source: null
  logit_source: "llama-3.1-8b-instruct"
  fold_version: "v2"
  data_class: "b"
  anchor_gamma_recommended: 0.1

log_file: "data_pipeline/common.dryrun.log"
