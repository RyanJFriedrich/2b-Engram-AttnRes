# RTX 6000 Pro Blackwell (96 GB, SM120) Token-Maxed Production Config
# Architecture: 41 layers, d_model=2048, d_ff=7168, 16 Q heads, 4 KV heads
# Target Hardware: RTX 6000 Pro Blackwell (96 GB GDDR7) + >=64 GB Host RAM
# Mathematical Equivalence: 32,768 tokens per optimizer step (same schedule & lr)

model: train/configs/model/olmo_2b_blackwell.yaml
data_shards:
  - data_pipeline/shards/shard_*
seq_len: 8192
shuffle: true
data_seed: 0

# Full Micro-batch 4 (zero accumulation loop overhead):
# 4 sequences * 8192 seq_len * 1 grad_accum = 32,768 tokens/step
batch_size: 4
grad_accum: 1

lr: 2.0e-4
min_lr_ratio: 0.1
warmup_steps: 20
cosine_steps: 12735
steps: 12735
weight_decay: 0.1
grad_clip: 1.0

alpha: 1.0
temperature: 1.0

# 96 GB VRAM allows massive loss chunks (maximizes SM120 cuBLAS GEMM throughput)
loss_chunk_size: 2048
mem_debug: true

bf16: true
master_dtype: bf16
optimizer: adamw8bit
grad_checkpointing: true
freeze_embeddings: true
seed: 0
init: prebuilt
prebuilt_path: exports/olmo-2b-base-v1

# Inductor kernel fusion on Linux SM120 (fuses RMSNorm, SwiGLU, and residual additions)
torch_compile: true

out_dir: train/runs/blackwell_6000_max
checkpoint_every: 100   # Hourly checkpoints (16.32 GB per checkpoint; fits all 21 in 454 GB)
log_every: 1            # Real-time telemetry monitoring
