# OLMo-2B model configuration (Spec v3.0 fork)
# d_model = 2048, 41 layers (10 blocks x [SWA, SWA, SWA, GLOBAL] + 1 GATHER)
# Apache 2.0 clean-room architecture.

vocab_size: 100278          # OLMo-3.1 BPE vocabulary
hidden_size: 2048           # SVD down-projected residual stream width
num_hidden_layers: 41       # 10 blocks x 4 layers + 1 gather layer
layer_types:
  # Block 1
  - swa
  - swa
  - swa
  - global
  # Block 2
  - swa
  - swa
  - swa
  - global
  # Block 3
  - swa
  - swa
  - swa
  - global
  # Block 4
  - swa
  - swa
  - swa
  - global
  # Block 5
  - swa
  - swa
  - swa
  - global
  # Block 6
  - swa
  - swa
  - swa
  - global
  # Block 7
  - swa
  - swa
  - swa
  - global
  # Block 8
  - swa
  - swa
  - swa
  - global
  # Block 9
  - swa
  - swa
  - swa
  - global
  # Block 10
  - swa
  - swa
  - swa
  - global
  # Gather layer (Layer 40)
  - gather
num_attention_heads: 16     # 16 Q heads (head_dim 128)
num_key_value_heads: 4      # 4 KV heads (4:1 GQA)
head_dim: 128
intermediate_size: 7168     # 3.5x SwiGLU FFN
rms_norm_eps: 1.0e-05
tie_word_embeddings: false  # untied
attn_query_chunk: 2048      # query chunking expanded to 2048 for 96 GB VRAM (reduces SWA autograd waves to 4)

swa:
  window: 4096              # base default
  rope_theta: 10000.0       # base default
  pattern:
    - window: 4096
      rope_theta: 10000.0
    - window: 4096
      rope_theta: 10000.0
    - window: 8192
      rope_theta: 25000.0
  sink:
    type: learned_logit     # per-head learned sink logit (0 KV footprint)
    init: -10.0             # near-no-op at step 0 (invariant I4)

global:
  rope_type: prope          # partial RoPE (rotate first 32 channels)
  rope_fraction: 0.25
  rope_theta: 1000000.0     # base default
  block_thetas:
    - 1000000.0             # Block 1
    - 1000000.0             # Block 2
    - 1000000.0             # Block 3
    - 1000000.0             # Block 4
    - 1000000.0             # Block 5
    - 5000000.0             # Block 6
    - 5000000.0             # Block 7
    - 5000000.0             # Block 8
    - 5000000.0             # Block 9
    - 5000000.0             # Block 10
  qk_norm: false

gather:
  rope_type: prope
  rope_fraction: 0.25
  rope_theta: 5000000.0     # matches blocks 6-10
  qk_norm: false
  init: random              # cold start: freshly initialized
  position: 40              # layer index 40 (final layer)

attn_res:
  enabled: true
  scope: globals_only       # 11 application points (10 block globals + 1 gather)
  sources: embedding_plus_block_delta_sums_plus_partial
  keys: rmsnorm
  values: raw
  pseudo_query_init: zeros  # uniform mix at step 0 (invariant I3)
  gate: false

engram:
  enabled: true
  orders: [1, 2, 3]
  heads_per_order: 2
  row_dim: 256
  rows_per_head: { 2: [4194301, 4194287], 3: [4194277, 4194271] }
  injection_point: 3        # output of layer 3 (Block 1 Global)
  canonical_compression: true
  canon_path: train/src/engram/assets/canon_olmo_v1.npy
  canon_sha256: "8bb4fa0dff964ec53035255a27c3dc6b635a4709aabda449105828ad4c6409ad"
  lr_mult: 5.0
  readout: kv
  key_dim: 128
  val_dim: 128
  softcap: 8.0
  temperature: 1.0
